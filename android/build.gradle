// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('io.github.cdimascio:dotenv-java:3.0.0')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// No Windows o caminho deste projeto estoura o MAX_PATH (260) ao compilar os
// modulos nativos C++ do Nitro (react-native-iap 14+): o CMake monta o caminho do
// .o embutindo o caminho absoluto do fonte, e o ninja falha no mkdir.
// Encurtar o diretorio de staging do CMake resolve sem exigir LongPathsEnabled.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
  subprojects { subproject ->
    subproject.afterEvaluate {
      if (subproject.extensions.findByName('android') != null) {
        subproject.android.externalNativeBuild.cmake.buildStagingDirectory =
          new File("C:/.cxx/${subproject.name}")
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
